<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        },
                        dark: {
                            950: '#0a0a0f',
                            900: '#101018',
                            800: '#181824',
                            700: '#252538',
                            600: '#3a3a52',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0f;
            background-image: 
                radial-gradient(at 0% 0%, rgba(38, 85, 139, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(24, 24, 36, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glow-text {
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body class="text-gray-200 font-sans antialiased flex flex-col min-h-screen">
    <!-- Navigation Bar -->
    <nav class="glass-panel border-b border-dark-700 shadow-xl">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <div class="p-2 rounded-xl bg-gradient-to-br from-primary-600 to-primary-800 shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4" />
                        </svg>
                    </div>
                    <h1 class="text-2xl font-bold text-white glow-text">
                        <span class="bg-clip-text text-transparent bg-gradient-to-r from-primary-400 to-blue-400">
                            DB Management
                        </span>
                    </h1>
                </div>
                <div class="flex items-center space-x-6">
                    {% if db_manager.db_name %}
                    <div class="flex items-center bg-dark-800 px-4 py-2 rounded-xl border border-dark-700 shadow-sm">
                        <div class="h-2.5 w-2.5 rounded-full bg-primary-400 mr-2.5 animate-pulse"></div>
                        <span class="font-medium text-primary-300">{{ db_manager.db_name }}</span>
                    </div>
                    {% endif %}
                    <a href="{{ url_for('index') }}" class="flex items-center space-x-2 text-gray-400 hover:text-white transition-colors duration-300">
                        <div class="p-2 rounded-xl bg-dark-800 hover:bg-primary-900/30 transition-colors duration-300">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                            </svg>
                        </div>
                        <span class="font-medium">Dashboard</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="glass-panel border-t border-dark-700 py-6">
        <div class="container mx-auto px-6 text-center text-gray-400 text-sm">
            <p>© <span id="year"></span> Database Management System</p>
        </div>
    </footer>

    <script>
        // Set current year in footer
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
