{% extends "base.html" %}

{% block content %}
<div class="max-w-lg mx-auto bg-gray-900 rounded-2xl shadow-2xl overflow-hidden p-8 mt-10 border border-gray-800 backdrop-blur-sm bg-opacity-90">
    <!-- Header with Glowing Icon -->
    <div class="flex justify-center mb-6">
        <div class="bg-gradient-to-br from-blue-900/30 to-blue-900/10 p-4 rounded-full border border-blue-800/30 shadow-lg shadow-blue-900/20">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4" />
            </svg>
        </div>
    </div>
    
    <!-- Title with Subtle Glow -->
    <h2 class="text-2xl font-bold mb-8 text-center text-white">
        <span class="bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-blue-300">Database Operations</span>
    </h2>
    
    <!-- Form Container -->
    <form method="POST" class="space-y-6">
        <!-- Input Field with Floating Label Effect -->
        <div class="relative">
            <input type="text" id="db_name" name="db_name" required 
                   class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 peer placeholder-transparent"
                   placeholder=" ">
            <label for="db_name" class="absolute left-4 -top-2.5 px-1 text-sm text-gray-400 bg-gray-900 transition-all duration-200 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-500 peer-placeholder-shown:top-3 peer-placeholder-shown:left-4 peer-placeholder-shown:bg-transparent peer-focus:-top-2.5 peer-focus:text-sm peer-focus:text-blue-400 peer-focus:bg-gray-900">
                Database Name
            </label>
            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 peer-focus:text-blue-400 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01" />
                </svg>
            </div>
        </div>
        
        <!-- Action Buttons with Hover Effects -->
        <div class="space-y-4">
            <!-- Create Button -->
            <button type="submit" name="operation" value="create" 
                    class="group w-full flex items-center justify-center px-6 py-3.5 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-medium rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-0.5">
                <span class="relative flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 group-hover:rotate-90 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    <span class="group-hover:scale-105 transition-transform duration-300">Create Database</span>
                </span>
                <span class="absolute h-px w-8 bg-blue-400/50 group-hover:w-16 group-hover:bg-blue-300 transition-all duration-500 opacity-0 group-hover:opacity-100 -bottom-1"></span>
            </button>
            
            <!-- Use Button -->
            <button type="submit" name="operation" value="use" 
                    class="group w-full flex items-center justify-center px-6 py-3.5 bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-500 hover:to-emerald-600 text-white font-medium rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-0.5">
                <span class="relative flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 group-hover:scale-110 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    <span class="group-hover:scale-105 transition-transform duration-300">Use Database</span>
                </span>
                <span class="absolute h-px w-8 bg-emerald-400/50 group-hover:w-16 group-hover:bg-emerald-300 transition-all duration-500 opacity-0 group-hover:opacity-100 -bottom-1"></span>
            </button>
            
            <!-- Delete Button -->
            <button type="submit" name="operation" value="delete" 
                    class="group w-full flex items-center justify-center px-6 py-3.5 bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-500 hover:to-rose-600 text-white font-medium rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-0.5">
                <span class="relative flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 group-hover:shake transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    <span class="group-hover:scale-105 transition-transform duration-300">Delete Database</span>
                </span>
                <span class="absolute h-px w-8 bg-rose-400/50 group-hover:w-16 group-hover:bg-rose-300 transition-all duration-500 opacity-0 group-hover:opacity-100 -bottom-1"></span>
            </button>
        </div>
    </form>
</div>

<style>
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-2px); }
        40%, 80% { transform: translateX(2px); }
    }
    .group-hover\:shake:hover { animation: shake 0.4s ease-in-out; }
</style>
{% endblock %}
