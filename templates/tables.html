{% extends "base.html" %}

{% block content %}
<div class="max-w-5xl mx-auto bg-gradient-to-br from-gray-900 to-gray-800 rounded-2xl shadow-xl overflow-hidden p-8 my-8 border border-gray-700/50">
    <!-- Header with Gradient Accent -->
    <div class="text-center mb-10">
        <h2 class="text-3xl font-bold text-white mb-2">
            <span class="relative">
                <span class="relative z-10">Table Operations</span>
                <span class="absolute bottom-0 left-0 right-0 h-2 bg-gradient-to-r from-blue-500/40 to-purple-500/40 -z-0"></span>
            </span>
        </h2>
        <p class="text-lg text-gray-300 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1.5 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01" />
            </svg>
            Database: <span class="font-semibold text-blue-400 ml-1">{{ db_name }}</span>
        </p>
    </div>
    
    <!-- Grid Layout with Subtle Pattern -->
    <div class="grid md:grid-cols-2 gap-8 relative">
        <div class="absolute inset-0 opacity-10 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2IiBoZWlnaHQ9IjYiPgo8cmVjdCB3aWR0aD0iNiIgaGVpZ2h0PSI2IiBmaWxsPSJ0cmFuc3BhcmVudCI+PC9yZWN0Pgo8cGF0aCBkPSJNMyAzTDMgM000IDNMNCA0TTYgMEwwIDZaIiBzdHJva2U9IiMzMzMiIHN0cm9rZS13aWR0aD0iMC41Ij48L3BhdGg+Cjwvc3ZnPg==')]"></div>

        <!-- Create Table Card -->
        <div class="relative bg-gray-800/80 p-7 rounded-xl border border-gray-700/50 shadow-sm hover:shadow-md transition-all duration-300 group overflow-hidden backdrop-blur-sm">
            <!-- Gradient Decoration -->
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-blue-500 to-purple-500"></div>
            
            <div class="flex items-center mb-6">
                <div class="bg-gradient-to-br from-blue-900/30 to-blue-900/10 p-2.5 rounded-lg mr-4 border border-blue-800/30 group-hover:shadow-inner transition-all duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-400 group-hover:text-blue-300 transition-colors duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                    </svg>
                </div>
                <h3 class="text-xl font-semibold text-white group-hover:text-blue-100 transition-colors duration-200">Create Table</h3>
            </div>
            
            <form method="POST" class="space-y-5">
                <!-- Table Name Field -->
                <div class="relative">
                    <input type="text" id="table_name" name="table_name" required 
                           class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-xl focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all duration-200 peer placeholder-transparent text-white"
                           placeholder=" ">
                    <label for="table_name" class="absolute left-3 -top-2.5 px-1 text-sm font-medium text-gray-400 bg-gray-800 transition-all duration-200 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-500 peer-placeholder-shown:top-3 peer-placeholder-shown:left-4 peer-placeholder-shown:bg-transparent peer-focus:-top-2.5 peer-focus:text-sm peer-focus:text-blue-400 peer-focus:bg-gray-800">
                        Table Name
                    </label>
                    <div class="absolute inset-y-0 right-0 flex items-center pr-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 peer-focus:text-blue-400 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                        </svg>
                    </div>
                </div>
                
                <!-- Columns Field -->
                <div class="relative">
                    <input type="text" id="columns" name="columns" required 
                           class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-xl focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all duration-200 peer placeholder-transparent text-white"
                           placeholder=" ">
                    <label for="columns" class="absolute left-3 -top-2.5 px-1 text-sm font-medium text-gray-400 bg-gray-800 transition-all duration-200 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-500 peer-placeholder-shown:top-3 peer-placeholder-shown:left-4 peer-placeholder-shown:bg-transparent peer-focus:-top-2.5 peer-focus:text-sm peer-focus:text-blue-400 peer-focus:bg-gray-800">
                        Columns
                    </label>
                    <div class="absolute inset-y-0 right-0 flex items-center pr-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 peer-focus:text-blue-400 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                        </svg>
                    </div>
                    <p class="mt-1.5 text-xs text-gray-500">Format: <span class="font-mono text-gray-400">column_name:type</span> (comma separated)</p>
                </div>
                
                <!-- Keys Section -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="relative">
                        <input type="text" id="primary_key" name="primary_key" required 
                               class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-xl focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all duration-200 peer placeholder-transparent text-white"
                               placeholder=" ">
                        <label for="primary_key" class="absolute left-3 -top-2.5 px-1 text-sm font-medium text-gray-400 bg-gray-800 transition-all duration-200 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-500 peer-placeholder-shown:top-3 peer-placeholder-shown:left-4 peer-placeholder-shown:bg-transparent peer-focus:-top-2.5 peer-focus:text-sm peer-focus:text-blue-400 peer-focus:bg-gray-800">
                            Primary Key
                        </label>
                    </div>
                    <div class="relative">
                        <input type="text" id="foreign_keys" name="foreign_keys" 
                               class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-xl focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all duration-200 peer placeholder-transparent text-white"
                               placeholder=" ">
                        <label for="foreign_keys" class="absolute left-3 -top-2.5 px-1 text-sm font-medium text-gray-400 bg-gray-800 transition-all duration-200 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-500 peer-placeholder-shown:top-3 peer-placeholder-shown:left-4 peer-placeholder-shown:bg-transparent peer-focus:-top-2.5 peer-focus:text-sm peer-focus:text-blue-400 peer-focus:bg-gray-800">
                            Foreign Keys
                        </label>
                    </div>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" name="operation" value="create" 
                        class="w-full mt-4 flex items-center justify-center px-6 py-3.5 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-medium rounded-xl shadow-md hover:shadow-lg transition-all duration-300 group/btn">
                    <span class="relative z-10 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 group-hover/btn:rotate-90 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                        <span class="group-hover/btn:translate-x-1 transition-transform duration-300">Create Table</span>
                    </span>
                    <span class="absolute h-px w-8 bg-blue-400/50 group-hover/btn:w-16 group-hover/btn:bg-blue-300 transition-all duration-500 opacity-0 group-hover/btn:opacity-100 -bottom-1"></span>
                </button>
            </form>
        </div>

        <!-- Delete Table Card -->
        <div class="relative bg-gray-800/80 p-7 rounded-xl border border-gray-700/50 shadow-sm hover:shadow-md transition-all duration-300 group overflow-hidden backdrop-blur-sm">
            <!-- Gradient Decoration -->
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-rose-500 to-pink-500"></div>
            
            <div class="flex items-center mb-6">
                <div class="bg-gradient-to-br from-rose-900/30 to-rose-900/10 p-2.5 rounded-lg mr-4 border border-rose-800/30 group-hover:shadow-inner transition-all duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-rose-400 group-hover:text-rose-300 transition-colors duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </div>
                <h3 class="text-xl font-semibold text-white group-hover:text-rose-100 transition-colors duration-200">Delete Table</h3>
            </div>
            
            <form method="POST" class="space-y-5">
                <!-- Table Name Field -->
                <div class="relative">
                    <input type="text" id="table_name" name="table_name" required 
                           class="w-full px-4 py-3 bg-gray-700/50 border border-gray-600/50 rounded-xl focus:ring-2 focus:ring-rose-500/50 focus:border-rose-500 transition-all duration-200 peer placeholder-transparent text-white"
                           placeholder=" ">
                    <label for="table_name" class="absolute left-3 -top-2.5 px-1 text-sm font-medium text-gray-400 bg-gray-800 transition-all duration-200 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-500 peer-placeholder-shown:top-3 peer-placeholder-shown:left-4 peer-placeholder-shown:bg-transparent peer-focus:-top-2.5 peer-focus:text-sm peer-focus:text-rose-400 peer-focus:bg-gray-800">
                        Table Name
                    </label>
                    <div class="absolute inset-y-0 right-0 flex items-center pr-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 peer-focus:text-rose-400 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                        </svg>
                    </div>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" name="operation" value="delete" 
                        class="w-full flex items-center justify-center px-6 py-3.5 bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-500 hover:to-rose-600 text-white font-medium rounded-xl shadow-md hover:shadow-lg transition-all duration-300 group/btn">
                    <span class="relative z-10 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 group-hover/btn:shake transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                        <span class="group-hover/btn:translate-x-1 transition-transform duration-300">Delete Table</span>
                    </span>
                    <span class="absolute h-px w-8 bg-rose-400/50 group-hover/btn:w-16 group-hover/btn:bg-rose-300 transition-all duration-500 opacity-0 group-hover/btn:opacity-100 -bottom-1"></span>
                </button>
            </form>
        </div>
    </div>
</div>

<style>
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-2px); }
        40%, 80% { transform: translateX(2px); }
    }
    .group-hover\/btn\:shake:hover { animation: shake 0.4s ease-in-out; }
</style>
{% endblock %}
